services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fresh_market
      POSTGRES_USER: fresh_market
      POSTGRES_PASSWORD: fresh_market_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresh_market -d fresh_market"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - fresh_market_db:/var/lib/postgresql/data

  api:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-compose-secret-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DATABASE_ENGINE: postgresql
      DATABASE_NAME: fresh_market
      DATABASE_USER: fresh_market
      DATABASE_PASSWORD: fresh_market_local
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      AUDIT_HMAC_KEY: local-audit-secret-change-me
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fresh_market_db:
